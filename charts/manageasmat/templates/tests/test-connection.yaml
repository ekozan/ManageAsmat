apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "manageasmat.fullname" . }}-test"
  labels:
    {{- include "manageasmat.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command: ['wget', '-qO-', '{{ include "manageasmat.fullname" . }}:{{ .Values.service.port }}']
